services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-nxtpro}
      POSTGRES_USER: ${DB_USERNAME:-nxtpro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nxtpro_db_password}
    ports:
      - "${DB_PUBLISHED_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-nxtpro_redis_password}
    command: >
      sh -c 'redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"'
    ports:
      - "${REDIS_PUBLISHED_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8081}
      STRICT_EXTERNAL_CONFIG_VALIDATION: ${STRICT_EXTERNAL_CONFIG_VALIDATION:-false}
      JWT_SECRET: ${JWT_SECRET:-compose_local_jwt_secret_minimum_32_chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-compose_local_refresh_secret_minimum_32_chars}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-nxtpro}
      DB_PASSWORD: ${DB_PASSWORD:-nxtpro_db_password}
      DB_NAME: ${DB_NAME:-nxtpro}
      DB_SSL: "false"
      DB_SSL_REJECT_UNAUTHORIZED: "false"
      DB_MIGRATIONS_RUN: ${DB_MIGRATIONS_RUN:-false}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_QUERY_TIMEOUT: ${DB_QUERY_TIMEOUT:-5000}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-nxtpro_redis_password}
      REDIS_TLS: "false"
      REDIS_DB_QUEUE: ${REDIS_DB_QUEUE:-0}
      REDIS_DB_CACHE: ${REDIS_DB_CACHE:-1}
      CACHE_TTL: ${CACHE_TTL:-300}
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-5}
      QUEUE_MAX_RETRIES: ${QUEUE_MAX_RETRIES:-3}
      QUEUE_LIMITER_MAX: ${QUEUE_LIMITER_MAX:-10}
      QUEUE_LIMITER_DURATION: ${QUEUE_LIMITER_DURATION:-1000}
      USE_MOCK_AI: ${USE_MOCK_AI:-true}
      AI_MODEL_API_URL: ${AI_MODEL_API_URL:-https://api.nxtpro.ai}
      AI_MODEL_API_KEY: ${AI_MODEL_API_KEY:-}
      AI_MODEL_TIMEOUT_MS: ${AI_MODEL_TIMEOUT_MS:-120000}
      UPLOAD_STORAGE_PROVIDER: local
      UPLOAD_LOCAL_DIR: uploads
      UPLOAD_PUBLIC_BASE_URL: ${UPLOAD_PUBLIC_BASE_URL:-http://localhost:3000/uploads}
      CDN_BASE_URL: ${CDN_BASE_URL:-https://cdn.nxtpro.com}
      MAX_VIDEO_SIZE_MB: ${MAX_VIDEO_SIZE_MB:-500}
      ALLOWED_VIDEO_FORMATS: ${ALLOWED_VIDEO_FORMATS:-mp4,mov,m4v,avi,webm,mkv,3gp}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-}
      GOOGLE_OAUTH_CLIENT_IDS: ${GOOGLE_OAUTH_CLIENT_IDS:-}
      GOOGLE_OAUTH_WEB_CLIENT_ID: ${GOOGLE_OAUTH_WEB_CLIENT_ID:-}
      GOOGLE_OAUTH_ANDROID_CLIENT_ID: ${GOOGLE_OAUTH_ANDROID_CLIENT_ID:-}
      GOOGLE_OAUTH_IOS_CLIENT_ID: ${GOOGLE_OAUTH_IOS_CLIENT_ID:-}
      GOOGLE_OAUTH_EXPO_CLIENT_ID: ${GOOGLE_OAUTH_EXPO_CLIENT_ID:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      SUPER_ADMIN_1_USERNAME: ${SUPER_ADMIN_1_USERNAME:-superadmin1}
      SUPER_ADMIN_1_EMAIL: ${SUPER_ADMIN_1_EMAIL:-superadmin1@nxtpro.local}
      SUPER_ADMIN_1_PASSWORD: ${SUPER_ADMIN_1_PASSWORD:-ChangeMeComposeAdmin1}
      SUPER_ADMIN_2_USERNAME: ${SUPER_ADMIN_2_USERNAME:-superadmin2}
      SUPER_ADMIN_2_EMAIL: ${SUPER_ADMIN_2_EMAIL:-superadmin2@nxtpro.local}
      SUPER_ADMIN_2_PASSWORD: ${SUPER_ADMIN_2_PASSWORD:-ChangeMeComposeAdmin2}
    ports:
      - "${API_PUBLISHED_PORT:-3000}:3000"
    volumes:
      - api_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/api/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  api_uploads:
