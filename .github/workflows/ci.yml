name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 3000
      CORS_ORIGIN: http://localhost:8081
      FRONTEND_BASE_URL: http://localhost:8081
      STRICT_EXTERNAL_CONFIG_VALIDATION: "false"
      JWT_SECRET: ci_jwt_secret_minimum_32_characters
      JWT_REFRESH_SECRET: ci_refresh_secret_minimum_32_chars
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: nxtpro_test
      DB_SSL: "false"
      DB_MIGRATIONS_RUN: "false"
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_TLS: "false"
      USE_MOCK_AI: "true"
      UPLOAD_PUBLIC_BASE_URL: http://localhost:3000/uploads
      CDN_BASE_URL: https://cdn.nxtpro.com
      MAX_VIDEO_SIZE_MB: 500
      ALLOWED_VIDEO_FORMATS: mp4,mov,m4v,avi,webm,mkv,3gp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
